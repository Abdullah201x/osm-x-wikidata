name: Deploy

# osmwd runs as a Coolify *Service* (raw compose built from the git URL), which has no
# git webhook: nothing redeploys on push. This workflow is the only automatic deploy path.
# It runs after CI (code pushes) or the data refresh (bot data commits, which do not
# trigger `push` workflows) finishes green on main, then proves the new build is live.

on:
  workflow_run:
    workflows: ["CI", "Update OSM x Wikidata Datasets"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE: https://wikidata.saudiosm.org
  SERVICE_UUID: wxlmccgoeqyzdt9mhzd7ty1m

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_URL / COOLIFY_TOKEN secrets are not set"
            exit 1
          fi
          curl -fsS --retry 3 --max-time 30 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$SERVICE_UUID&force=false"

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait until production serves this commit
        run: |
          for i in $(seq 1 36); do
            sleep 20
            ok=1
            curl -fsS --max-time 15 "$SITE/" -o live.html || ok=0
            [ "$ok" = 1 ] && cmp -s live.html index.html || { echo "[$i] index.html not updated yet"; ok=0; }
            [ "$ok" = 1 ] && { curl -fsS --max-time 15 -o /dev/null "$SITE/api/healthz/freshness" || { echo "[$i] freshness not 200"; ok=0; }; }
            [ "$ok" = 1 ] && { curl -fsS --max-time 15 -o /dev/null "$SITE/data/reverse_sa.json" || { echo "[$i] reverse_sa.json missing"; ok=0; }; }
            if [ "$ok" = 1 ]; then
              total=$(curl -fsS --max-time 15 "$SITE/api/v1/reverse?cc=sa&page_size=1" | python3 -c "import json,sys; print(json.load(sys.stdin).get('total', 0))" || echo 0)
              [ "$total" -gt 0 ] || { echo "[$i] reverse API empty"; ok=0; }
            fi
            if [ "$ok" = 1 ]; then
              echo "Production is live and healthy."
              exit 0
            fi
          done
          echo "::error::Production did not serve this commit within 12 minutes"
          exit 1
