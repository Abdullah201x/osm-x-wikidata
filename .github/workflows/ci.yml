name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt httpx

      - name: Lint with Ruff
        run: |
          python -m ruff check

      - name: Run unit & integration tests
        run: |
          python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build API image
        run: docker build -f backend/Dockerfile -t osmwd-api:ci .

      - name: Build web image
        run: docker build -f Dockerfile -t osmwd-web:ci .

      - name: Validate Caddyfile inside the web image
        run: docker run --rm osmwd-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: API image finds its datasets
        run: |
          docker run --rm osmwd-api:ci python -c "
          import sys; sys.path.insert(0, '/app')
          from app.store import DatasetStore
          s = DatasetStore()
          assert s.summary.get('updated_at'), 'summary.json not loaded'
          assert s.reverse_datasets.get('sa'), 'reverse_sa.json not loaded'
          print('datasets:', sorted(s.reverse_datasets))
          "

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Python (static server for e2e smoke tests)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests (production CSP)
        run: npm run smoke
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
