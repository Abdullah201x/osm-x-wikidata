name: Update OSM x Wikidata Datasets

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download GCC OSM extract
        run: |
          mkdir -p "$RUNNER_TEMP/osm"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/osm/gcc-states-latest.osm.pbf" \
            https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf

      - name: Run Wikidata & OSM sync pipeline
        run: |
          python update_data.py --refresh-wikidata --pbf "$RUNNER_TEMP/osm/gcc-states-latest.osm.pbf"
        env:
          PYTHONUNBUFFERED: "1"

      - name: Validate dataset schema and shrink guard
        run: |
          python pipeline/validate_data.py

      - name: Commit and push updated datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update GCC OSM x Wikidata datasets"
            git push
          fi
