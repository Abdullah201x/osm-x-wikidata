[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = .git .venv venv node_modules vendor data test-results .pytest_cache .ruff_cache __pycache__
filterwarnings =
    ignore::DeprecationWarning
    ignore::DeprecationWarning:pytest_asyncio

