[tool.ruff]
target-version = "py312"
line-length = 140
exclude = [
    ".git",
    "venv",
    ".venv",
    "vendor",
    "node_modules",
    "__pycache__",
]

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.coverage.run]
source = ["backend/app", "pipeline"]
omit = [
    "tests/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
